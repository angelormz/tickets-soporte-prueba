<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Tickets de Soporte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f7fb; }
        .navbar-brand { white-space: normal; }
        .card { border: 0; box-shadow: 0 .25rem 1rem rgba(0, 0, 0, .06); }
        .table th { white-space: nowrap; }
        .alert-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1080;
            width: min(24rem, calc(100% - 2rem));
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Sistema de Tickets de Soporte</span>
    </div>
</nav>

<div id="alertas" class="alert-container" aria-live="polite" aria-atomic="true"></div>

<main class="container py-4 py-lg-5">
    <section class="card mb-4">
        <div class="card-body p-3 p-md-4">
            <h2 class="h4 mb-4">Registrar nuevo ticket</h2>
            <form id="ticketForm" class="row g-3">
                <div class="col-md-6">
                    <label for="solicitante" class="form-label">Nombre del solicitante</label>
                    <input type="text" class="form-control" id="solicitante" required maxlength="150">
                </div>
                <div class="col-md-6">
                    <label for="area" class="form-label">Área</label>
                    <input type="text" class="form-control" id="area" required maxlength="100">
                </div>
                <div class="col-md-8">
                    <label for="asunto" class="form-label">Asunto</label>
                    <input type="text" class="form-control" id="asunto" required maxlength="200">
                </div>
                <div class="col-md-4">
                    <label for="prioridad" class="form-label">Prioridad</label>
                    <select class="form-select" id="prioridad" required>
                        <option value="BAJA">Baja</option>
                        <option value="MEDIA" selected>Media</option>
                        <option value="ALTA">Alta</option>
                    </select>
                </div>
                <div class="col-12">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea class="form-control" id="descripcion" rows="4" required></textarea>
                </div>
                <div class="col-12 d-flex justify-content-end">
                    <button type="submit" id="guardarBtn" class="btn btn-primary">Guardar ticket</button>
                </div>
            </form>
        </div>
    </section>

    <section class="card">
        <div class="card-body p-3 p-md-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <h2 class="h4 mb-0">Tickets registrados</h2>
                <button type="button" id="actualizarBtn" class="btn btn-outline-primary btn-sm">
                    Actualizar lista
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Solicitante</th>
                        <th>Área</th>
                        <th>Asunto</th>
                        <th>Prioridad</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody id="ticketsBody">
                    <tr>
                        <td colspan="8" class="text-center text-secondary py-4">Cargando tickets...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
